services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ordo
      POSTGRES_PASSWORD: ordo_local
      POSTGRES_DB: ordo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ordo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordo"]
      interval: 5s
      retries: 10
volumes:
  ordo_pg:
